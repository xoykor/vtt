[package]
name = "vtt-tauri"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vtt-tauri"
path = "src/main.rs"

[lib]
name = "vtt_tauri"
path = "src/lib.rs"

[features]
default = []
# Default-off: `tauri`/`tauri-build` only resolve with network (crates.io
# is unreachable from the dev sandbox, HTTP 403). Local `cargo test`
# uses default features; CI builds `--features tauri-app`.
tauri-app = ["dep:tauri", "dep:tauri-build"]

[dependencies]
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }
